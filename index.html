<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CameraCapture</title>
</head>

<body>
    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <div id="moldura-validade">
            <span>Posicione a validade aqui</span>
        </div>
    </div>

    <canvas id="canvas" hidden></canvas>

    <button id="abrirCamera">Abrir Camera</button>
    <button id="btn-encerrar">Fechar</button>
    <button id="btn-capturar">Capturar</button>

    <!--Previa da foto-->
    <section id="area-foto">
        <h2>Fotografia capturada</h2>
        <img id="foto-capturada" src="" alt="" hidden>
    </section>

    <!--Previa da imagem recortada-->
    <section id="area-recortada">
        <h2>Região Recortada</h2>
        <img id="foto-recortada" src="" alt="" hidden>

    </section>
 
    <script type="module" src="main.js"></script>
</body>

</html>
